<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Lizome Design</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101010">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/webclip.png">
</head>
<body>
  <main class="wrapper-home _404">
    <div class="_404-wrap">
      <h1 class="sr-only">Page not found</h1>
      <p>The page you are looking for doesn’t exist.</p>
      <a href="/" class="btn btn-wide">
        <div class="btn-text-wrap">
          <div class="btn-text-parent">
            <div>Go back home</div>
            <div aria-hidden="true">Go back home</div>
          </div>
        </div>
        <div class="button-arrow-outer" aria-hidden="true">
          <div class="button-arrow-wrap">
            <div class="button-arrow-parent">
              <div class="button-arrow"><img src="/images/Arrow.png" width="12" height="12" alt="" class="arrow"></div>
              <div class="button-arrow _2nd"><img src="/images/Arrow.png" width="12" height="12" alt="" class="arrow"></div>
            </div>
          </div>
        </div>
        <div class="bg-home-midgray"></div>
      </a>
    </div>
  </main>
  <div class="home-overlay" aria-hidden="true">
    <div class="bg-dots"></div>
    <div class="bg-dots two"></div>
    <div class="bg-dots three"></div>
  </div>
</body>
</html>
